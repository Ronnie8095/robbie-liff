<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>記帳</title>
<!--
  Robbie LIFF 記帳表單
  - 一個表單可有多組（每組一個日期＋購物人），每組可記一筆或按「再加一筆」記多筆
  - 送出時以使用者身分傳「/記帳」多行逐筆文字到聊天室，由 webhook 既有的 parse_multi_entry_text 解析
  - 格式（每行帶自己的日期與購物人；不指定購物人就省略）：
      /記帳
      2026-11-03 Ronnie 便當 120
      2026-11-03 Ronnie 雞蛋 x2 90     ← 數量 > 1 時加「x數量」，金額為總計
      2026-11-04 Jenny 咖啡 60
  - 修改模式：由收據預覽的「✏️ 修改」開啟（網址帶 ?edit=<base64url JSON>），只有一組，送出「/記帳修改」，可填負數折扣
  - 部署：放到 HTTPS 靜態託管（如 GitHub Pages），LIFF App 的 Endpoint 指向這個網址，Scope 勾 chat_message.write
-->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d1f23; --muted: #6b7280;
    --line: #e5e7eb; --accent: #06c755; --accent-text: #ffffff; --chip: #eef2f5; --danger: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111315; --card: #1b1e21; --text: #eceef0; --muted: #9aa1a9;
      --line: #2b2f33; --chip: #262a2e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111315; --card: #1b1e21; --text: #eceef0; --muted: #9aa1a9;
    --line: #2b2f33; --chip: #262a2e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 120px; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .label { font-size: 13px; color: var(--muted); margin: 10px 0 6px; }
  .label:first-child { margin-top: 0; }
  input {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: flex; gap: 8px; }
  .seg button {
    flex: 1; font: inherit; padding: 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: none; background: var(--chip); color: var(--text);
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .group.active { border-color: var(--accent); }
  .ghead { display: flex; justify-content: space-between; align-items: center; }
  .gtitle { font-weight: 600; }
  .gdel { border: none; background: none; color: var(--danger); font: inherit; font-size: 14px; cursor: pointer; padding: 0; }
  .item { display: grid; grid-template-columns: 1fr 64px 96px 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .item .del { border: none; background: none; color: var(--danger); font-size: 22px; cursor: pointer; padding: 0; }
  .head { display: grid; grid-template-columns: 1fr 64px 96px 32px; gap: 8px; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  .add, .addgroup {
    display: block; width: 100%; font: inherit; padding: 10px; border-radius: 10px;
    border: 1px dashed var(--line); background: none; color: var(--muted); cursor: pointer;
  }
  .addgroup { margin-bottom: 14px; padding: 12px; }
  .subtotal { text-align: right; color: var(--muted); font-size: 14px; margin-top: 6px; }
  .total { text-align: right; color: var(--muted); }
  .total b { color: var(--text); font-size: 18px; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--line);
  }
  footer button {
    display: block; width: 100%; max-width: 520px; margin: 0 auto; font: inherit; font-size: 17px; font-weight: 600;
    padding: 14px; border: none; border-radius: 12px; background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  footer button:disabled { opacity: .5; }
  #msg { white-space: pre-wrap; font-size: 14px; color: var(--muted); }
  #msg.err { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1 id="title">記帳</h1>

  <div class="card" id="chipCard">
    <div class="label">常用品項（點一下加到目前這組）</div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="groups"></div>
  <button class="addgroup" id="addGroupBtn" type="button">＋ 新增一組（不同日期或購物人）</button>

  <div class="card"><div class="total">合計 <b id="sum">0</b> 元</div></div>

  <div class="card" id="msgCard" hidden><div id="msg"></div></div>
</main>
<footer><button id="submitBtn" type="button">送出記帳</button></footer>

<template id="groupTpl">
  <section class="card group">
    <div class="ghead"><span class="gtitle"></span><button class="gdel" type="button">刪除這組</button></div>
    <div class="label">日期</div>
    <input class="gdate" type="date">
    <div class="label">購物人</div>
    <div class="seg gwho"></div>
    <div class="head"><span>品項</span><span>數量</span><span>金額（總計）</span><span></span></div>
    <div class="items"></div>
    <button class="add" type="button">＋ 再加一筆</button>
    <div class="subtotal">小計 <span class="gsum">0</span> 元</div>
  </section>
</template>

<script>
  // 部署前填入 LINE Developers 建立的 LIFF ID
  const LIFF_ID = "2012357701-tmkTBOo3";
  // 與 scripts/accounting_handler.py 的 PURCHASER_NAMES 一致
  const PURCHASERS = ["Ronnie", "Jenny"];
  const NO_PURCHASER = "不指定";
  const PURCHASER_OPTIONS = [...PURCHASERS, NO_PURCHASER];
  const QUICK_ITEMS = ["早餐", "午餐", "晚餐", "便當", "咖啡", "飲料", "水果", "加油", "停車費", "捷運", "衛生紙", "日用品"];

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const today = () => {
    const now = new Date();
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  };
  let liffReady = false;
  // 修改模式：由收據預覽的「✏️ 修改」按鈕開啟，送出時改用 /記帳修改
  let editMode = false;
  let activeGroup = null;

  // ── 組（日期＋購物人） ──

  const groups = () => [...$("groups").querySelectorAll(".group")];

  function setActive(group) {
    activeGroup = group;
    groups().forEach((g) => g.classList.toggle("active", g === group && groups().length > 1));
  }

  function renderWho(group) {
    const box = group.querySelector(".gwho");
    box.innerHTML = "";
    PURCHASER_OPTIONS.forEach((name) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = name;
      b.className = name === group.dataset.who ? "on" : "";
      b.onclick = () => {
        group.dataset.who = name;
        if (group === groups()[0]) { try { localStorage.setItem("purchaser", name); } catch (e) {} }
        renderWho(group);
      };
      box.appendChild(b);
    });
  }

  function renumber() {
    const list = groups();
    list.forEach((g, i) => {
      g.querySelector(".gtitle").textContent = list.length > 1 ? `第 ${i + 1} 組` : "記帳明細";
      g.querySelector(".gdel").hidden = list.length === 1 || editMode;
    });
    setActive(list.includes(activeGroup) ? activeGroup : list[list.length - 1]);
  }

  function addGroup() {
    const prev = groups()[groups().length - 1];
    const group = $("groupTpl").content.firstElementChild.cloneNode(true);
    // 新的一組：日期沿用上一組；購物人預設換成另一位，方便「同一天不同人」
    group.querySelector(".gdate").value = prev ? prev.querySelector(".gdate").value : today();
    if (prev) {
      group.dataset.who = PURCHASERS.find((p) => p !== prev.dataset.who) || PURCHASERS[0];
    } else {
      let saved = null;
      try { saved = localStorage.getItem("purchaser"); } catch (e) {}
      group.dataset.who = PURCHASER_OPTIONS.includes(saved) ? saved : PURCHASERS[0];
    }
    renderWho(group);
    group.addEventListener("focusin", () => setActive(group));
    group.addEventListener("click", () => setActive(group));
    group.querySelector(".add").onclick = () => addItem(group, "");
    group.querySelector(".gdel").onclick = (ev) => {
      ev.stopPropagation();
      const filled = [...group.querySelectorAll(".item")].some(rowFilled);
      if (filled && !confirm("確定刪除這一組？")) return;
      group.remove();
      renumber(); updateSum();
    };
    $("groups").appendChild(group);
    addItem(group, "");
    renumber();
    setActive(group);
    return group;
  }

  // ── 品項列 ──

  const rowFilled = (row) => row.querySelector(".name").value || row.querySelector(".price").value;

  function addItem(group, name, focusPrice) {
    const rows = group.querySelectorAll(".item");
    const last = rows[rows.length - 1];
    // 點常用品項時，若最後一列是空白就直接填進去
    if (name && last && !rowFilled(last)) {
      last.querySelector(".name").value = name;
      if (focusPrice) last.querySelector(".price").focus();
      return last;
    }
    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML =
      '<input class="name" placeholder="品名" maxlength="40">' +
      '<input class="qty" type="number" inputmode="numeric" min="1" value="1">' +
      '<input class="price" type="number" inputmode="numeric" placeholder="元" autocomplete="off">' +
      '<button class="del" type="button" aria-label="刪除">×</button>';
    row.querySelector(".name").value = name || "";
    // 新的一筆金額一律留空（不沿用瀏覽器還原／自動填入的上一筆金額）
    row.querySelector(".price").value = "";
    row.querySelector(".price").oninput = updateSum;
    row.querySelector(".del").onclick = () => {
      row.remove();
      if (!group.querySelector(".item")) addItem(group, "");
      updateSum();
    };
    group.querySelector(".items").appendChild(row);
    (focusPrice ? row.querySelector(".price") : row.querySelector(".name")).focus();
    return row;
  }

  function updateSum() {
    let total = 0;
    groups().forEach((g) => {
      let sub = 0;
      g.querySelectorAll(".price").forEach((el) => { sub += parseInt(el.value, 10) || 0; });
      g.querySelector(".gsum").textContent = sub.toLocaleString();
      total += sub;
    });
    $("sum").textContent = total.toLocaleString();
  }

  // ── 送出 ──

  function collect() {
    const result = [];
    const seen = {};
    const list = groups();
    for (let gi = 0; gi < list.length; gi++) {
      const g = list[gi];
      const label = list.length > 1 ? `第 ${gi + 1} 組` : "";
      const items = [];
      for (const row of g.querySelectorAll(".item")) {
        // 品名不可含換行、逗號（會被解析器當成分隔），也不可含購物人名稱
        let name = row.querySelector(".name").value.replace(/[\n\r,，、]/g, " ").trim();
        PURCHASERS.forEach((p) => { name = name.replace(new RegExp(p, "ig"), "").trim(); });
        const price = parseInt(row.querySelector(".price").value, 10);
        const qty = Math.max(1, parseInt(row.querySelector(".qty").value, 10) || 1);
        if (!name && isNaN(price)) continue;
        if (!name || isNaN(price)) return { error: `${label}每一筆都要填品名與金額` };
        // 一般記帳走既有文字解析，不支援負數；只有收據修改模式可以送折扣
        if (!editMode && price < 0) return { error: "手動記帳請直接填折扣後的金額" };
        if (/^\d+$/.test(name)) return { error: `品名不能只有數字：${name}` };
        items.push({ name, qty, price });
      }
      if (!items.length) continue;
      const day = g.querySelector(".gdate").value;
      if (!day) return { error: `${label}請選擇日期` };
      const who = g.dataset.who === NO_PURCHASER ? "" : g.dataset.who;
      const key = `${day}|${who}`;
      if (seen[key]) return { error: `${label}與${seen[key]}的日期和購物人相同，請合併成同一組` };
      seen[key] = label || "前一組";
      result.push({ day, who, items });
    }
    if (!result.length) return { error: "請至少填一筆" };
    return { groups: result };
  }

  const itemText = (it) => (it.qty > 1 ? `${it.name} x${it.qty} ${it.price}` : `${it.name} ${it.price}`);

  function buildText(list) {
    if (editMode) {
      const g = list[0];
      return ["/記帳修改", `${g.day} ${g.who}`.trim(), ...g.items.map(itemText)].join("\n");
    }
    const lines = [];
    list.forEach((g) => g.items.forEach((it) => lines.push(`${g.day} ${g.who} ${itemText(it)}`.replace(/\s+/g, " "))));
    return ["/記帳", ...lines].join("\n");
  }

  function showMsg(text, isErr) {
    $("msgCard").hidden = false;
    $("msg").textContent = text;
    $("msg").className = isErr ? "err" : "";
  }

  async function submit() {
    updateSum();
    const { groups: list, error } = collect();
    if (error) return showMsg(error, true);
    const text = buildText(list);

    // 不在 LINE 內開啟（例如本機預覽）時，只顯示會送出的文字
    if (!liffReady || !liff.isInClient()) {
      return showMsg("預覽模式（未在 LINE 內開啟），將送出：\n\n" + text, false);
    }
    $("submitBtn").disabled = true;
    try {
      await liff.sendMessages([{ type: "text", text }]);
      liff.closeWindow();
    } catch (e) {
      $("submitBtn").disabled = false;
      showMsg("送出失敗：" + (e && e.message ? e.message : e) + "\n請確認 LIFF 已勾選 chat_message.write，且是從聊天室開啟。", true);
    }
  }

  // ── 收據修改模式 ──

  function readEditParam() {
    const params = new URLSearchParams(location.search);
    let value = params.get("edit");
    // 從 liff.line.me 開啟時，查詢參數會先包在 liff.state 裡
    const state = params.get("liff.state");
    if (!value && state && state.indexOf("?") >= 0) {
      value = new URLSearchParams(state.slice(state.indexOf("?") + 1)).get("edit");
    }
    return value;
  }

  function decodePayload(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bytes = Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  function applyEditMode() {
    if (editMode) return;
    const raw = readEditParam();
    if (!raw) return;
    let data;
    try { data = decodePayload(raw); } catch (e) { return showMsg("無法讀取收據辨識結果，請改用手動輸入", true); }
    if (!data || !Array.isArray(data.i) || !data.i.length) return;

    editMode = true;
    $("title").textContent = "修改收據記帳";
    $("submitBtn").textContent = "送出修改後的記帳";
    $("addGroupBtn").hidden = true;
    $("groups").innerHTML = "";
    const g = addGroup();
    const m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(data.d || "");
    if (m) g.querySelector(".gdate").value = `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    g.dataset.who = PURCHASERS.includes(data.p) ? data.p : NO_PURCHASER;
    renderWho(g);
    g.querySelector(".items").innerHTML = "";
    data.i.forEach(([name, qty, price]) => {
      const row = addItem(g, "");
      row.querySelector(".name").value = name;
      row.querySelector(".qty").value = qty || 1;
      row.querySelector(".price").value = price;
    });
    renumber();
    document.activeElement && document.activeElement.blur();
    updateSum();
  }

  // ── 初始化 ──

  QUICK_ITEMS.forEach((name) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = name;
    b.onclick = () => { addItem(activeGroup || groups()[0], name, true); };
    $("chips").appendChild(b);
  });
  $("addGroupBtn").onclick = () => addGroup();
  $("submitBtn").onclick = submit;
  addGroup();
  applyEditMode();
  // 頁面從快取還原（例如按「再記一筆」重新開啟）時，重置成乾淨的表單；收據修改模式保留預填內容
  window.addEventListener("pageshow", (ev) => {
    if (!ev.persisted || editMode) return;
    $("groups").innerHTML = "";
    activeGroup = null;
    addGroup();
    updateSum();
    $("msgCard").hidden = true;
    $("submitBtn").disabled = false;
  });

  if (window.liff && LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID") {
    liff.init({ liffId: LIFF_ID })
      .then(() => { liffReady = true; applyEditMode(); })
      .catch((e) => showMsg("LIFF 初始化失敗：" + (e && e.message ? e.message : e), true));
  }
</script>
</body>
</html>
